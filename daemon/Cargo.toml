[package]
name = "codexbar-linuxd"
version = "0.0.0"
edition = "2021"
description = "CodexBar GNOME user daemon"
license = "MIT"

[lib]
name = "codexbar_linuxd"
path = "src/lib.rs"

[[bin]]
name = "codexbar-linuxd"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
time = { version = "=0.3.37", features = ["formatting"] }
tokio = { version = "=1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
futures-util = "=0.3.31"
tempfile = "=3.27.0"
