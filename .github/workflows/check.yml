name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jsonschema libglib2.0-bin dbus
      - name: Run checks
        run: ./scripts/check.sh
